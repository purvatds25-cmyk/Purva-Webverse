<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Math Flashcards</title>

    <style>
        /* =========================
           GENERAL STYLING
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 100%;
            max-width: 550px;
            text-align: center;
        }

        /* =========================
           HEADER
        ========================== */

        .header {
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        /* =========================
           SCORE BOARD
        ========================== */

        .score-board {
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 18px 25px;
            border-radius: 15px;
            margin-bottom: 20px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .score-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .score-box span {
            color: #777;
            font-size: 14px;
        }

        .score-box strong {
            color: #5b4bc4;
            font-size: 22px;
        }

        /* =========================
           FLASHCARD
        ========================== */

        .flashcard {
            background: white;
            padding: 45px 35px;
            border-radius: 25px;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);

            transition: transform 0.3s;
        }

        .flashcard:hover {
            transform: translateY(-5px);
        }

        .card-title {
            color: #777;
            font-size: 17px;
            margin-bottom: 20px;
        }

        .question {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
        }

        /* =========================
           INPUT
        ========================== */

        .answer-input {
            width: 100%;
            padding: 15px;

            border: 2px solid #ddd;
            border-radius: 12px;

            font-size: 20px;
            text-align: center;

            outline: none;
            margin-bottom: 15px;
        }

        .answer-input:focus {
            border-color: #667eea;
        }

        /* =========================
           BUTTONS
        ========================== */

        button {
            border: none;
            border-radius: 12px;
            padding: 14px 25px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        .check-btn {
            width: 100%;
            background: #667eea;
            color: white;
        }

        .check-btn:hover {
            background: #5548c7;
            transform: translateY(-2px);
        }

        .check-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           FEEDBACK
        ========================== */

        .feedback {
            min-height: 30px;
            margin-top: 15px;

            font-size: 17px;
            font-weight: bold;
        }

        /* =========================
           PROGRESS BAR
        ========================== */

        .progress-container {
            width: 100%;
            height: 8px;

            background: rgba(255, 255, 255, 0.4);

            border-radius: 10px;

            margin: 20px 0;

            overflow: hidden;
        }

        .progress {
            width: 10%;
            height: 100%;

            background: white;

            transition: width 0.3s;
        }

        /* =========================
           NEXT BUTTON
        ========================== */

        .next-btn {
            width: 100%;

            background: white;
            color: #5b4bc4;
        }

        .next-btn:hover {
            transform: translateY(-2px);
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           RESTART BUTTON
        ========================== */

        .restart-btn {
            margin-top: 12px;

            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .restart-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* =========================
           MOBILE RESPONSIVE
        ========================== */

        @media (max-width: 500px) {

            .header h1 {
                font-size: 28px;
            }

            .flashcard {
                padding: 35px 20px;
            }

            .question {
                font-size: 38px;
            }

            .score-board {
                padding: 15px 18px;
            }
        }
    </style>
</head>


<body>

    <div class="container">

        <!-- =========================
             HEADER
        ========================== -->

        <div class="header">

            <h1>🧮 Math Flashcards</h1>

            <p>
                Practice • Solve • Improve
            </p>

        </div>


        <!-- =========================
             SCORE BOARD
        ========================== -->

        <div class="score-board">

            <div class="score-box">

                <span>
                    Question
                </span>

                <strong id="questionNumber">
                    1 / 10
                </strong>

            </div>


            <div class="score-box">

                <span>
                    Score
                </span>

                <strong id="score">
                    0
                </strong>

            </div>

        </div>


        <!-- =========================
             FLASHCARD
        ========================== -->

        <div class="flashcard">

            <div class="card-title">
                Solve this problem
            </div>


            <div
                class="question"
                id="question">

                Loading...

            </div>


            <input
                type="number"
                id="answer"
                class="answer-input"
                placeholder="Enter your answer"
                autocomplete="off"
            >


            <button
                class="check-btn"
                id="checkBtn"
                onclick="checkAnswer()">

                Check Answer

            </button>


            <div
                class="feedback"
                id="feedback">

            </div>

        </div>


        <!-- =========================
             PROGRESS BAR
        ========================== -->

        <div class="progress-container">

            <div
                class="progress"
                id="progress">
            </div>

        </div>


        <!-- =========================
             NEXT BUTTON
        ========================== -->

        <button
            class="next-btn"
            id="nextBtn"
            onclick="nextQuestion()"
            disabled>

            Next Question →

        </button>


        <!-- =========================
             RESTART BUTTON
        ========================== -->

        <button
            class="restart-btn"
            onclick="restartGame()">

            🔄 Restart Quiz

        </button>

    </div>


    <script>

        /* =========================
           GAME VARIABLES
        ========================== */

        let currentQuestion = 1;

        let score = 0;

        const totalQuestions = 10;

        let correctAnswer = 0;

        let answered = false;


        /* =========================
           GENERATE QUESTION
        ========================== */

        function generateQuestion() {

            answered = false;


            // Generate two random numbers
            let num1 =
                Math.floor(Math.random() * 20) + 1;

            let num2 =
                Math.floor(Math.random() * 20) + 1;


            // Randomly select + or -
            let operation =
                Math.random() < 0.5 ? "+" : "-";


            // Prevent negative subtraction answers
            if (operation === "-" && num2 > num1) {

                let temporary = num1;

                num1 = num2;

                num2 = temporary;

            }


            // Calculate answer
            if (operation === "+") {

                correctAnswer =
                    num1 + num2;

            } else {

                correctAnswer =
                    num1 - num2;

            }


            // Display question
            document.getElementById("question")
                .textContent =
                num1 + " " +
                operation + " " +
                num2 + " = ?";


            // Clear input
            document.getElementById("answer")
                .value = "";


            // Clear feedback
            document.getElementById("feedback")
                .textContent = "";


            // Enable Check button
            document.getElementById("checkBtn")
                .disabled = false;


            // Disable Next button
            document.getElementById("nextBtn")
                .disabled = true;


            // Update progress
            updateProgress();


            // Focus input
            document.getElementById("answer")
                .focus();

        }


        /* =========================
           CHECK ANSWER
        ========================== */

        function checkAnswer() {

            if (answered) {
                return;
            }


            let input =
                document.getElementById("answer");


            let feedback =
                document.getElementById("feedback");


            // Check empty answer
            if (input.value === "") {

                feedback.textContent =
                    "⚠️ Please enter an answer.";

                feedback.style.color =
                    "orange";

                return;

            }


            let userAnswer =
                Number(input.value);


            answered = true;


            // Correct answer
            if (userAnswer === correctAnswer) {

                score++;


                feedback.textContent =
                    "🎉 Correct! Great job!";


                feedback.style.color =
                    "green";

            }


            // Wrong answer
            else {

                feedback.textContent =
                    "❌ Incorrect! Correct answer is "
                    + correctAnswer;


                feedback.style.color =
                    "red";

            }


            // Update score
            document.getElementById("score")
                .textContent = score;


            // Disable Check button
            document.getElementById("checkBtn")
                .disabled = true;


            // Enable Next button
            document.getElementById("nextBtn")
                .disabled = false;

        }


        /* =========================
           NEXT QUESTION
        ========================== */

        function nextQuestion() {

            // If quiz is finished
            if (currentQuestion >= totalQuestions) {

                showResult();

                return;

            }


            currentQuestion++;


            // Update question counter
            document.getElementById("questionNumber")
                .textContent =
                currentQuestion +
                " / " +
                totalQuestions;


            // Generate new question
            generateQuestion();

        }


        /* =========================
           UPDATE PROGRESS
        ========================== */

        function updateProgress() {

            let percentage =
                (currentQuestion / totalQuestions) * 100;


            document.getElementById("progress")
                .style.width =
                percentage + "%";

        }


        /* =========================
           SHOW FINAL RESULT
        ========================== */

        function showResult() {

            let message;


            if (score >= 8) {

                message =
                    "🌟 Excellent work!";

            }

            else if (score >= 5) {

                message =
                    "👍 Good job!";

            }

            else {

                message =
                    "💪 Keep practicing!";

            }


            document.querySelector(".flashcard")
                .innerHTML = `

                    <div class="card-title">
                        🎊 Quiz Completed!
                    </div>

                    <div class="question">
                        ${score} / ${totalQuestions}
                    </div>

                    <p style="
                        font-size:20px;
                        color:#555;
                        margin-bottom:20px;
                    ">
                        ${message}
                    </p>

                    <button
                        onclick="restartGame()"
                        style="
                            background:#667eea;
                            color:white;
                        ">

                        Play Again

                    </button>

                `;


            // Hide Next button
            document.getElementById("nextBtn")
                .style.display = "none";


            // Hide Restart button
            document.querySelector(".restart-btn")
                .style.display = "none";

        }


        /* =========================
           RESTART QUIZ
        ========================== */

        function restartGame() {

            currentQuestion = 1;

            score = 0;


            // Update score
            document.getElementById("score")
                .textContent = "0";


            // Update question number
            document.getElementById("questionNumber")
                .textContent = "1 / 10";


            // Recreate flashcard
            document.querySelector(".flashcard")
                .innerHTML = `

                    <div class="card-title">
                        Solve this problem
                    </div>

                    <div
                        class="question"
                        id="question">

                        Loading...

                    </div>

                    <input
                        type="number"
                        id="answer"
                        class="answer-input"
                        placeholder="Enter your answer"
                        autocomplete="off"
                    >

                    <button
                        class="check-btn"
                        id="checkBtn"
                        onclick="checkAnswer()">

                        Check Answer

                    </button>

                    <div
                        class="feedback"
                        id="feedback">

                    </div>

                `;


            // Show Next button
            document.getElementById("nextBtn")
                .style.display = "block";


            document.getElementById("nextBtn")
                .disabled = true;


            // Show Restart button
            document.querySelector(".restart-btn")
                .style.display = "inline-block";


            // Generate first question
            generateQuestion();

        }


        /* =========================
           ENTER KEY SUPPORT
        ========================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    if (!answered) {

                        checkAnswer();

                    } else {

                        nextQuestion();

                    }

                }

            }
        );
        generateQuestion();

    </script>

</body>

</html>
